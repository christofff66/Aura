name: Build Aura V17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Android project
        run: |
          set -e
          mkdir -p build
          ZIP_FILE="AURA_ANDROID_V17_RELEASE_CANDIDATE_RECONSTRUCTED-2.zip"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : $ZIP_FILE non trouvé"
            exit 1
          fi
          
          unzip -q "$ZIP_FILE" -d build

      - name: Set project directory
        run: |
          PROJECT_DIR=$(find build -name "settings.gradle.kts" -type f | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERREUR : settings.gradle.kts introuvable"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.10 --distribution-type all || true
            chmod +x gradlew
          fi

      - name: Create gradle.properties
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
          org.gradle.java.home=${java.home}
          kotlin.jvmTarget=17
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          EOF

      - name: Create init.gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p gradle
          cat > gradle/init.gradle << 'EOF'
          gradle.allprojects { project ->
            afterEvaluate {
              project.tasks.withType(JavaCompile).configureEach { task ->
                task.sourceCompatibility = JavaVersion.VERSION_17
                task.targetCompatibility = JavaVersion.VERSION_17
                task.options.release = 17
              }
              project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                task.kotlinOptions.jvmTarget = "17"
              }
              if (project.hasProperty("android")) {
                project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
              }
            }
          }
          EOF

      - name: Update Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.10-all.zip|' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean assembleDebug --init-script gradle/init.gradle --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if find . -type f -name "*.apk" | grep -q .; then
            echo "Build successful - APK generated"
            find . -type f -name "*.apk" -exec ls -lh {} \;
          else
            echo "Error: No APK found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-V17-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
