name: Build Aura V17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Android project
        run: |
          set -e
          mkdir -p build
          
          if [ ! -f "AURA_ANDROID_V17_RELEASE_CANDIDATE_RECONSTRUCTED-2.zip" ]; then
            echo "ERREUR : Fichier ZIP non trouvé"
            echo "Fichiers disponibles :"
            ls -lah
            exit 1
          fi
          
          echo "Extraction du ZIP..."
          unzip -q AURA_ANDROID_V17_RELEASE_CANDIDATE_RECONSTRUCTED-2.zip -d build

          echo "===== PROJET AURA ====="
          find build/AURA_ANDROID_V17_RECONSTRUCTED -maxdepth 5 -type f | sort

      - name: Set project directory
        run: |
          PROJECT_DIR="build/AURA_ANDROID_V17_RECONSTRUCTED"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERREUR : settings.gradle.kts introuvable"
            echo "Contenu du répertoire :"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradlew" ]; then
            echo "Gradle Wrapper trouvé"
            chmod +x gradlew
            ./gradlew --version
          else
            echo "ERREUR : gradlew non trouvé"
            find . -name "gradlew" -o -name "gradle-wrapper.properties"
            exit 1
          fi

      - name: Update Gradle Wrapper to 8.10
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10-all.zip|' gradle/wrapper/gradle-wrapper.properties
            echo "=== Updated gradle-wrapper.properties ==="
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Fix Java/Kotlin Target Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/JavaVersion\.VERSION_[0-9]*/JavaVersion.VERSION_17/g' app/build.gradle.kts || true
            sed -i 's/sourceCompatibility = [0-9]*\.[0-9]*/sourceCompatibility = 17/g' app/build.gradle.kts || true
            sed -i 's/targetCompatibility = [0-9]*\.[0-9]*/targetCompatibility = 17/g' app/build.gradle.kts || true
            sed -i 's/jvmTarget = "[^"]*"/jvmTarget = "17"/g' app/build.gradle.kts || true
            
            echo "=== Updated app/build.gradle.kts ==="
            head -50 app/build.gradle.kts
          else
            echo "AVERTISSEMENT : app/build.gradle.kts non trouvé"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== APK GÉNÉRÉS ====="
          find . -type f -name "*.apk" -print || echo "Aucun APK trouvé"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-V17-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
