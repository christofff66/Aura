name: Build Aura V17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Android project
        run: |
          set -e
          mkdir -p build
          ZIP_FILE="AURA_ANDROID_V17_RELEASE_CANDIDATE_RECONSTRUCTED-2.zip"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : $ZIP_FILE non trouvé"
            exit 1
          fi
          
          unzip -q "$ZIP_FILE" -d build

      - name: Set project directory
        run: |
          PROJECT_DIR=$(find build -name "settings.gradle.kts" -type f | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERREUR : settings.gradle.kts introuvable"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.10 --distribution-type all || true
            chmod +x gradlew
          fi

      - name: Create gradle.properties with JVM Toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > gradle.properties << 'EOF'
# JVM Configuration
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
org.gradle.java.home=${java.home}

# Kotlin Configuration
kotlin.jvmTarget=17

# Android Configuration
android.useAndroidX=true
android.enableJetifier=true

# Build Configuration
org.gradle.parallel=true
org.gradle.configureondemand=true
EOF
          echo "✓ gradle.properties créé"

      - name: Create init.gradle for JVM Toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p gradle
          cat > gradle/init.gradle << 'EOF'
gradle.allprojects {
  afterEvaluate { project ->
    // Force Java 17 for all compilation tasks
    project.tasks.withType(JavaCompile).configureEach {
      sourceCompatibility = JavaVersion.VERSION_17
      targetCompatibility = JavaVersion.VERSION_17
      options.release = 17
    }
    
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
      kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
      }
    }
    
    // Android-specific configuration
    if (project.hasProperty("android")) {
      project.android {
        compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
    }
  }
}
EOF
          echo "✓ gradle/init.gradle créé"

      - name: Update Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-all.zip|' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"
          ORG_GRADLE_PROJECT_kotlin_jvmTarget: "17"
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --init-script gradle/init.gradle \
            -Dorg.gradle.java.home=$JAVA_HOME \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if find . -type f -name "*.apk" -print | grep -q .; then
            echo "✓ BUILD RÉUSSI - APK généré"
            find . -type f -name "*.apk" -exec ls -lh {} \;
          else
            echo "✗ Aucun APK trouvé"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-V17-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
