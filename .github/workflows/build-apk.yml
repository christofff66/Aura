name: Build Aura V17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e
          mkdir -p build
          unzip -q AURA_ANDROID_V17_RELEASE_CANDIDATE_RECONSTRUCTED-2.zip -d build

          echo "===== PROJET AURA ====="
          find build/AURA_ANDROID_V17_RECONSTRUCTED -maxdepth 5 -type f | sort

      - name: Set project directory
        run: |
          PROJECT_DIR="build/AURA_ANDROID_V17_RECONSTRUCTED"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERREUR : settings.gradle.kts introuvable"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-[0-9.]*-all\.zip/gradle-8.10-all.zip/' gradle/wrapper/gradle-wrapper.properties
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Fix Java/Kotlin Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            # Check if compileOptions already exists
            if ! grep -q "sourceCompatibility" app/build.gradle.kts; then
              # Add compileOptions block after android {
              cat > /tmp/patch.txt << 'EOF'
            
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            
            kotlinOptions {
                jvmTarget = "17"
            }
EOF
              # Insert after "android {" line
              sed -i '/^android {/r /tmp/patch.txt' app/build.gradle.kts
            fi
            
            echo "=== app/build.gradle.kts after patch ==="
            head -30 app/build.gradle.kts
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK GÉNÉRÉS ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-V17-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
