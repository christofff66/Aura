name: Build Aura V17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e
          mkdir -p build
          unzip -q AURA_ANDROID_V17_RELEASE_CANDIDATE_RECONSTRUCTED-2.zip -d build

          echo "===== PROJET AURA ====="
          find build/AURA_ANDROID_V17_RECONSTRUCTED -maxdepth 5 -type f | sort

      - name: Set project directory
        run: |
          PROJECT_DIR="build/AURA_ANDROID_V17_RECONSTRUCTED"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERREUR : settings.gradle.kts introuvable"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update Gradle Wrapper to 8.10
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10-all.zip|' gradle/wrapper/gradle-wrapper.properties
            echo "=== Updated gradle-wrapper.properties ==="
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Fix Java/Kotlin Target Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            # Fix Java target to 11 to match Gradle AGP requirements
            sed -i 's/JavaVersion\.VERSION_[0-9]*/JavaVersion.VERSION_11/g' app/build.gradle.kts || true
            sed -i 's/sourceCompatibility = [0-9]*\.[0-9]*/sourceCompatibility = 11/g' app/build.gradle.kts || true
            sed -i 's/targetCompatibility = [0-9]*\.[0-9]*/targetCompatibility = 11/g' app/build.gradle.kts || true
            
            # Ensure kotlinOptions jvmTarget is set to 11
            if ! grep -q "jvmTarget" app/build.gradle.kts; then
              # Add kotlinOptions if missing
              sed -i '/android {/a\    kotlinOptions {\n        jvmTarget = "11"\n    }' app/build.gradle.kts
            else
              sed -i 's/jvmTarget = "[^"]*"/jvmTarget = "11"/g' app/build.gradle.kts
            fi
            
            echo "=== Updated app/build.gradle.kts (first 50 lines) ==="
            head -50 app/build.gradle.kts
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK GÉNÉRÉS ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-V17-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
